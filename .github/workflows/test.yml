# test.yml

name: test

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]
  push:
    branches: [main]

jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pre-commit/action@v3.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: 26.x
      - run: |
          npm install -g @devcontainers/cli
          devcontainer features test --base-image mcr.microsoft.com/devcontainers/base:ubuntu26.04 .
